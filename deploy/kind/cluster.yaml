# kind cluster for Agent Studio local dev (§16.1 of IMPLEMENTATION.md)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - { containerPort: 30080, hostPort: 8088 }   # control-plane API (/api/v1) — 8080 is taken by gvproxy
      - { containerPort: 30300, hostPort: 3000 }   # web console (Next.js)
      - { containerPort: 30083, hostPort: 8083 }   # Keycloak OIDC/SSO
