apiVersion: v1
kind: Namespace
metadata:
  name: agent-studio-system
---
# --- Tier-1 Postgres (control-plane DB) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: agent-studio-system
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: agentstudio }
            - { name: POSTGRES_PASSWORD, value: agentstudio }
            - { name: POSTGRES_DB, value: agentstudio }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "agentstudio"] }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: agent-studio-system
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
# --- RBAC: control plane may provision per-agent namespaces (FR-12.1) ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: control-plane
  namespace: agent-studio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-studio-provisioner
rules:
  - apiGroups: [""]
    resources: [namespaces, resourcequotas]
    verbs: [get, list, create, update, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-studio-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-studio-provisioner
subjects:
  - kind: ServiceAccount
    name: control-plane
    namespace: agent-studio-system
---
# --- Control plane API ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: agent-studio-system
spec:
  replicas: 1
  selector: { matchLabels: { app: control-plane } }
  template:
    metadata: { labels: { app: control-plane } }
    spec:
      serviceAccountName: control-plane
      containers:
        - name: api
          image: agent-studio/control-plane:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://agentstudio:agentstudio@postgres.agent-studio-system.svc:5432/agentstudio
            # agent nodes reach models ONLY through the gateway (FR-4.3, FR-13.1) — no provider keys here
            - { name: AGENT_MODEL_BASE_URL, value: "http://agentgateway.agent-studio-system.svc:9000/v1" }
            - { name: AGENT_MODEL_API_KEY, value: "gw-dev-key" }
            # enterprise identity (FR-12.5). In prod: mount JWT_SECRET from a Secret and front with OIDC/SSO.
            - { name: JWT_SECRET, value: "dev-jwt-secret-please-rotate-in-prod-000" }
            - { name: BOOTSTRAP_ADMIN_EMAIL, value: "admin@agentstudio.dev" }
            - { name: BOOTSTRAP_ADMIN_PASSWORD, value: "admin12345" }
            - { name: DEV_RESET_DB, value: "1" }
            # OIDC/SSO via Keycloak (primary auth path; local HS256 remains the dual-issuer fallback)
            - { name: OIDC_JWKS_URL, value: "http://keycloak.agent-studio-system.svc:8083/realms/agent-studio/protocol/openid-connect/certs" }
            - { name: OIDC_ISSUER, value: "http://keycloak.agent-studio-system.svc:8083/realms/agent-studio" }
            - { name: OIDC_TENANT_CLAIM, value: "tenant" }
            # RuntimePort → Agent Substrate: cli nodes execute as actor pods (FR-3.6, FR-4.3)
            - { name: SUBSTRATE_URL, value: "http://substrate.agent-studio-system.svc:9100" }
            - { name: CLI_DEFAULT_IMAGE, value: "agent-studio/control-plane:dev" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: agent-studio-system
spec:
  type: NodePort
  selector: { app: control-plane }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
