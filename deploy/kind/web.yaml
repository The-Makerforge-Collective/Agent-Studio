apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-console
  namespace: agent-studio-system
spec:
  replicas: 1
  selector: { matchLabels: { app: web-console } }
  template:
    metadata: { labels: { app: web-console } }
    spec:
      containers:
        - name: web
          image: agent-studio/web-console:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: NEXT_PUBLIC_API_URL, value: "http://localhost:8088" }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-console
  namespace: agent-studio-system
spec:
  type: NodePort
  selector: { app: web-console }
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
